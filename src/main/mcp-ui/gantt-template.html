<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="light dark"><title>VRP-0 · Gantt</title><!-- MCP_STYLE --></head>
<body>
<main id="app" class="mcp-root result-presentation gantt-app" aria-busy="true">
  <header class="app-header"><div class="brand" aria-label="VRP-0"><img src="data:image/png;base64,<!-- MCP_LOGO -->" width="28" height="28" alt="" aria-hidden="true"><span>VRP-0</span></div><h1 id="gantt-title">Gantt 图</h1><div class="header-actions"><button type="button" id="refresh" hidden disabled>刷新</button><button type="button" id="fullscreen" disabled>全屏查看</button></div></header>
  <div id="notice" class="notice" role="status" aria-live="polite" hidden></div>
  <div class="toolbar"><label class="engineer-filter"><span id="engineer-label">工程师</span><select id="engineer" aria-labelledby="engineer-label"><option value="">全部工程师</option></select></label><button type="button" id="sidebar-toggle" aria-expanded="false" aria-controls="sidebar" hidden>对象列表</button><div class="gantt-tools"><button type="button" id="gantt-out" aria-label="缩小时间轴">−</button><button type="button" id="gantt-in" aria-label="放大时间轴" hidden>＋</button></div></div>
  <div class="workspace"><aside id="sidebar" class="sidebar" hidden><div class="side-tabs" role="tablist" aria-label="对象类型"><button type="button" id="side-agents" role="tab" aria-selected="true" aria-controls="side-list">工程师</button><button type="button" id="side-tickets" role="tab" aria-selected="false" aria-controls="side-list" tabindex="-1">工单</button></div><label class="search-label"><span class="sr-only" id="search-label">检索</span><input id="search" type="search" aria-labelledby="search-label" autocomplete="off"></label><div id="side-list" class="side-list" role="tabpanel"></div><div id="side-detail" class="side-detail"></div></aside>
    <div class="stage"><section class="gantt-panel"><div class="gantt-heading"><div id="gantt-legend" class="gantt-legend"></div></div><div id="gantt-scroll" class="gantt-scroll" tabindex="0" aria-label="只读排程时间轴"><div id="gantt-chart"></div></div></section><section id="inline-detail" class="inline-detail" aria-label="选中对象"></section></div>
  </div>
  <footer id="footer" class="app-footer">只读结果 · 业务计划时间</footer>
</main><!-- MCP_SCRIPT -->
</body></html>
