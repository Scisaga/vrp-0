vrp.scenario.store.dir=./data/scenarios/
vrp.solverjob.store.dir=./data/solver_jobs/
%test.vrp.scenario.store.dir=./build/test-data/scenarios/
%test.vrp.solverjob.store.dir=./build/test-data/solver_jobs/
%test.amap.config-file=./build/test-data/amap-config.json
https://quarkus.io/guides/logging.
quarkus.log.console.format=%d{yy-MM-dd HH:mm:ss.SSS} %-5p (%t) [%C{2.}:%L] %M %s%e%n
quarkus.index-dependency.log4j.group-id=org.apache.logging.log4j
quarkus.index-dependency.log4j.artifact-id=log4j-core
quarkus.index-dependency.log4j-api.group-id=org.apache.logging.log4j
quarkus.index-dependency.log4j-api.artifact-id=log4j-api

#quarkus.optaplanner.solver.domain-access-type=REFLECTION
quarkus.native.additional-build-args=--report-unsupported-elements-at-runtime
quarkus.native.resources.excludes=META-INF/resources/static/node_modules/**
quarkus.swagger-ui.always-include=true

# Access-Control-Allow-Origin https://cn.quarkus.io/guides/security-cors
quarkus.http.cors=true
quarkus.http.cors.origins=/.*/
quarkus.http.cors.headers=origin, accept, authorization, content-type, x-requested-with
quarkus.http.cors.access-control-allow-credentials=true
quarkus.http.cors.methods=GET,PUT,POST,DELETE
quarkus.tls.trust-all=false

quarkus.test.hang-detection-timeout=PT4H
quarkus.application.name=vrp-0

vrp.mcp.enabled=false
vrp.mcp.path=/mcp
vrp.mcp.auth.token=change-me
vrp.mcp.allowed-origins=

amap.enabled=true
amap.app-key=change-me
amap.qps=10
amap.quota=10000
amap.interval=86400
amap.wait-timeout=10
amap.config-file=data/amap-config.json
amap.geocode-provider=AMAP
amap.address-resolver-url=http://127.0.0.1:5000/api/resolve
amap.address-resolver-fallback-to-amap=true

map.provider=AMAP
here.api-key=change-me
here.qps=10
here.quota=10000
here.interval=86400
here.wait-timeout=10
here.matrix-routing-enabled=false

# \u5F00\u542F\u8BE5\u914D\u7F6E\uFF0C\u53EF\u4F7F\u9879\u76EE\u7684 native image \u4E8C\u8FDB\u5236\u6587\u4EF6\u8FD0\u884C\u65F6\uFF0C\u5728 Linux \u4E2D\u88AB VisualVM \u89C2\u6D4B
