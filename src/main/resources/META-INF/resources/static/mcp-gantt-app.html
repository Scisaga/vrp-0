.gantt-label button span:last-child {

}
.gantt-track {

}
.gantt-gridline {

}

}
.gantt-bar {

  border-radius: 0;

}
.gantt-bar[data-phase="service"] {

}
.gantt-bar[data-phase="service"]:hover {

}
.gantt-bar[data-phase="service"][aria-pressed="true"] {

}
.gantt-location,.gantt-duration {

}

.gantt-bar[data-narrow="true"] .gantt-location {

}

.gantt-bar[data-phase="travel"],.gantt-bar[data-phase="travel"]:hover,.gantt-bar[data-phase="travel"][aria-pressed="true"] {

.gantt-travel-line {

}
.gantt-travel-label {

  height: 19px;

  font-size: 10px;
  line-height: 19px;
  border: 0;

  padding: 0;

.gantt-travel-label svg {

.gantt-wait-label {

.gantt-bar:focus-visible {

}

:root[data-theme="dark"] .result-sequence-badge {

}
:root[data-theme="dark"] .result-summary-score-medium {
  color: #fcd34d;
}
:root[data-theme="dark"] .result-summary-score-soft {
  color: #6ee7b7;
}

}
.inline-detail {

}

}

}

}

}

}

}
