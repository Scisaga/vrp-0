  --gantt-wait-line: #8c9eb4;
}
@media (any-pointer:coarse) {
  .gantt-app[data-mode="inline"] {
    --gantt-row-height: 44px;
    --gantt-band-height: 32px;
  }
}
@media (max-width:600px) {
  .gantt-app[data-mode="inline"] .gantt-grid {
    min-width: calc(var(--gantt-label-width) + 596px);
  }
}
.gantt-tooltip {
  position: fixed;
  z-index: 10;
  max-width: min(calc(100vw - 8px),284px);
  max-height: calc(100vh - 8px);
  overflow: auto;
  padding: 6px 9px;
  border-radius: 5px;
  background: #24364b;
  color: #fff;
  overflow-wrap: anywhere;
  font-size: 12px;
  line-height: 17px;
}
.gantt-tooltip span {
  display: block;
  color: #d5dfeb;
  font-variant-numeric: tabular-nums;
}
:root[data-theme="dark"] .result-sequence-badge {
  background: #203c36;
}
:root[data-theme="dark"] .result-summary-score-hard {
  color: #fda4af;
}
:root[data-theme="dark"] .result-summary-score-medium {
  color: #fcd34d;
}
:root[data-theme="dark"] .result-summary-score-soft {
  color: #6ee7b7;
}
.gantt-missing {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  gap: 5px;
  flex-wrap: wrap;
  padding: 8px;
}
.gantt-missing button {
  font-size: 12px;
}
.inline-detail {
  padding: 10px 16px;
  border-top: 1px solid var(--line);
  max-height: 150px;
  overflow: auto;
}
.gantt-app .inline-detail {
  max-height: 230px;
}
.gantt-ticket-detail>.detail-heading {
  font-family: ui-monospace,monospace;
  font-size: 12px;
  font-weight: 500;
  overflow-wrap: anywhere;
}
.gantt-ticket-detail.inline-detail>.detail-heading {
  font-family: inherit;
  font-size: 14px;
  font-weight: 600;
  line-height: 1.4;
  margin: 0;
}
.gantt-stage-detail {
  margin-top: 2px;
  color: var(--muted);
  font-size: 13px;
  font-variant-numeric: tabular-nums;
}
.gantt-ticket-detail summary {
  width: -moz-fit-content;
  width: fit-content;
  margin: 6px 0 0;
  padding: 3px 0;
  cursor: pointer;
  color: var(--accent);
  font-size: 12px;
  font-weight: 600;
}
.gantt-ticket-detail summary:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
.gantt-ticket-detail details[open] summary {
  margin-bottom: 5px;
}
@media (min-width:760px) {
  .gantt-app .inline-detail .detail-grid {
    grid-template-columns: 110px minmax(0,1fr) 110px minmax(0,1fr);
  }
}
.detail-heading {
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
  margin-bottom: 6px;
}
.detail-grid {
  display: grid;
  grid-template-columns: minmax(100px,auto) minmax(0,1fr);
  gap: 0;
  margin: 0;
  border-top: 1px solid var(--line);
}
.detail-grid dt {
  color: var(--muted);
  font-size: 12px;
  background: var(--surface-alt);
  padding: 7px 10px;
  border-bottom: 1px solid var(--line);
}
.detail-grid dd {
  margin: 0;
  overflow-wrap: anywhere;
  font-size: 13px;
  padding: 7px 10px;
  border-bottom: 1px solid var(--line);
}
.ordered-tickets {
  max-height: 175px;
  overflow: auto;
  border-top: 1px solid var(--line);
}
.ticket-row {
  width: 100%;
  display: flex;
  align-items: flex-start;
  gap: 10px;
  text-align: left;
  border: 0;
  border-radius: 0;
  border-bottom: 1px solid var(--line);
  padding: 9px 16px;
}
.ticket-row:last-child {
  border-bottom: 0;
}
.ticket-row .number {
  font-family: ui-monospace,monospace;
  font-variant-numeric: tabular-nums;
  color: var(--muted);
  min-width: 22px;
}
.ticket-row .row-copy {
  flex: 1;
  min-width: 0;
  overflow-wrap: anywhere;
}
.ticket-row small {
  display: block;
  color: var(--muted);
  font-size: 12px;
  margin-top: 2px;
}
.sidebar {
  width: 300px;
  flex: none;
  display: flex;
  flex-direction: column;
  min-height: 0;
  border-right: 1px solid var(--line);
}
.gantt-app .sidebar {
  order: 2;
  border-right: 0;
  border-left: 1px solid var(--line);
}
.side-tabs {
  padding: 10px 12px;
  flex: none;
}
.side-tabs button {
  flex: 1;
}
.search-label {
  padding: 0 12px 10px;
  display: block;
  flex: none;
}
.search-label input {
  width: 100%;
}
.side-list {
  flex: 1;
  min-height: 100px;
  overflow: auto;
  border-top: 1px solid var(--line);
}
.side-list .ticket-row {
  padding: 9px 12px;
}
.side-detail {
  max-height: 42%;
  overflow: auto;
  padding: 12px;
  border-top: 1px solid var(--line);
}
.side-detail:empty {
  display: none;
}
.playback {
  border-top: 1px solid var(--line);
  padding: 10px 16px;
  flex: none;
}
.playback-heading {
  display: flex;
  gap: 12px;
  align-items: center;
  flex-wrap: wrap;
  margin-bottom: 8px;
}
.playback-heading strong {
  font-size: 13px;
}
.playback-heading span {
  color: var(--muted);
  font-size: 12px;
}
.playback-controls {
  display: flex;
  gap: 10px;
  align-items: center;
  flex-wrap: wrap;
}
.playback-controls input {
  flex: 1;
}
.speed-label {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 12px;
}
.playback-states {
  display: flex;
  gap: 5px 12px;
  flex-wrap: wrap;
  max-height: 46px;
  overflow: auto;
  font-size: 12px;
  color: var(--muted);
  margin-top: 6px;
}
.app-switch {
  padding: 9px 16px;
  border-top: 1px solid var(--line);
  display: flex;
  flex: none;
  gap: 10px;
  align-items: flex-start;
  flex-wrap: wrap;
}
.app-switch button[aria-disabled="true"] {
  cursor: wait;
  opacity: .55;
}
.app-switch>div {
  display: flex;
  gap: 8px;
  flex: 1;
  min-width: min(100%,320px);
  flex-wrap: wrap;
}
.app-switch p {
  flex-basis: 100%;
  margin: 0;
  color: var(--muted);
}
.app-switch textarea {
  flex: 1;
  min-width: min(100%,180px);
  resize: vertical;
  border: 1px solid var(--line);
  background: var(--surface-alt);
  color: var(--ink);
  padding: 7px;
  font: inherit;
}
#gantt-actions {
  align-items: center;
}
#gantt-actions .gantt-legend {
  min-width: 0;
  gap: 5px 12px;
}
#gantt-actions #intent-status {
  flex-basis: 100%;
}
.gantt-app[data-mode="inline"] #open-map {
  min-height: 32px;
  border: 0;
  color: var(--accent);
  font-size: 13px;
  font-weight: 600;
}
.gantt-app[data-mode="inline"] #open-map::after {
  content: "";
  display: inline-block;
  width: 6px;
  height: 6px;
  margin: 0 2px 1px 7px;
  transform: rotate(-45deg);
  border: solid currentColor;
  border-width: 0 1.5px 1.5px 0;
}
.mcp-marker {
  background: var(--agent-color,#4338ca);
  border: 2px solid #fff;
  color: #fff;
  border-radius: 18px;
  min-width: 26px;
  min-height: 26px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 2px 6px;
  font-size: 12px;
  box-shadow: 0 1px 4px #0005;
  white-space: nowrap;
}
.mcp-marker[data-kind="agent"] {
  border-radius: 5px;
}
.mcp-marker[data-selected="true"] {
  outline: 3px solid #fbbf24;
  outline-offset: 1px;
}
.map-canvas .amap-logo,.map-canvas .amap-copyright {
  pointer-events: auto;
}
.map-canvas .amap-marker-label {
  border: 0;
  background: transparent;
  padding: 0;
}
.mcp-root[data-mode="fullscreen"] {
  height: 100dvh;
  min-height: 0;
  overflow: hidden;
}
.mcp-root[data-mode="fullscreen"] .map-panel {
  height: auto;
  min-height: 180px;
}
.mcp-root[data-mode="fullscreen"] .gantt-panel {
  height: 0;
  min-height: 180px;
}
.mcp-root[data-mode="fullscreen"] .gantt-scroll {
  height: 0;
  flex: 1;
  min-height: 0;
}
.mcp-root[data-mode="fullscreen"] .inline-detail {
  display: none;
}
.mcp-root[data-mode="fullscreen"] .ordered-tickets {
  display: none;
}
@media (max-width:400px) {
  .map-app[data-mode="fullscreen"] .engineer-filter>span {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0,0,0,0);
    white-space: nowrap;
    border: 0;
  }
}
@media (max-width:700px) {
  .app-header {
    padding: 10px;
    gap: 8px;
  }
  .header-actions button {
    font-size: 12px;
    padding-inline: 7px;
  }
  .toolbar {
    padding: 8px 10px;
    gap: 6px;
  }
  .engineer-filter {
    max-width: 100%;
    flex: 1 0 100%;
    order: 2;
    justify-content: flex-start;
    font-size: 12px;
    margin-left: 0;
  }
  .engineer-filter>span {
    white-space: nowrap;
  }
  .engineer-filter select {
    max-width: none;
    flex: 1;
  }
  .summary-strip {
    grid-template-columns: repeat(3,minmax(0,1fr));
  }
  .summary-item {
    display: flex;
    flex-direction: column;
  }
  .summary-label {
    border-right: 0;
    padding: 6px 8px;
  }
  .summary-value {
    padding: 6px 8px;
    font-size: 14px;
  }
  .summary-score {
    display: grid;
    grid-template-columns: auto minmax(0,1fr);
  }
  .summary-score .summary-value {
    gap: 4px 12px;
  }
  .gantt-heading {
    padding: 8px 10px;
  }
  .gantt-legend {
    gap: 5px 10px;
  }
  .sidebar {
    width: 260px;
  }
  .mcp-root[data-mode="fullscreen"] .workspace {
    position: relative;
  }
  .mcp-root[data-mode="fullscreen"] .sidebar {
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    max-width: 88%;
    z-index: 5;
    background: var(--surface);
    box-shadow: 5px 0 18px #0002;
  }
  .playback {
    padding: 8px 10px;
  }
  .playback-controls {
    gap: 6px;
  }
  .playback-controls output {
    font-size: 11px;
    width: 100%;
  }
  .task-heading h1 {
    font-size: 15px;
  }
  .detail-grid {
    grid-template-columns: 90px minmax(0,1fr);
  }
}
@media (prefers-reduced-motion:reduce) {
  *,*::before,*::after {
    scroll-behavior: auto !important;
    transition: none !important;
    animation: none !important;
  }
}
.gantt-app .app-header {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
}
.gantt-app .app-header .engineer-filter {
  margin: 0;
  max-width: 100%;
  order: 0;
}
.gantt-app .app-header .engineer-filter select {
  min-width: 0;
  max-width: 100%;
}
.gantt-app .app-header h1 {
  text-align: center;
}
.gantt-app .app-header .header-actions {
  justify-self: end;
}
.gantt-app[data-mode="inline"] .engineer-filter > span {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip-path: inset(50%);
}
@media (max-width: 700px) {
  .gantt-app .app-header {
    grid-template-columns: minmax(0, 1fr) auto auto;
  }
  .gantt-app .app-header .engineer-filter > span {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
  }
  .gantt-app .app-header .header-actions {
    flex-wrap: nowrap;
  }
}
@media (max-width:480px) {
  .gantt-app[data-mode="inline"] .gantt-label {
    padding-inline: 8px 6px;
  }
  .gantt-app[data-mode="inline"] .gantt-label button span:last-child {
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    white-space: normal;
    overflow-wrap: anywhere;
  }
  .gantt-app[data-mode="fullscreen"] .app-header {
    grid-template-columns: minmax(0,1fr) auto;
  }
  .gantt-app[data-mode="fullscreen"] h1 {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
  }
}
