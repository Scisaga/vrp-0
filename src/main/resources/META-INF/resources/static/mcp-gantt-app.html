  .mcp-root[data-mode="fullscreen"] .workspace {
    position: relative;
  }
  .mcp-root[data-mode="fullscreen"] .sidebar {
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    max-width: 88%;
    z-index: 5;
    background: var(--surface);
    box-shadow: 5px 0 18px #0002;
  }
  .playback {
    padding: 8px 10px;
  }
  .playback-controls {
    gap: 6px;
  }
  .playback-controls output {
    font-size: 11px;
    width: 100%;
  }
  .task-heading h1 {
    font-size: 15px;
  }
  .detail-grid {
    grid-template-columns: 90px minmax(0,1fr);
  }
}
@media (prefers-reduced-motion:reduce) {
  *,*::before,*::after {
    scroll-behavior: auto !important;
    transition: none !important;
    animation: none !important;
  }
}
.gantt-app .app-header {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
}
.gantt-app .app-header .engineer-filter {
  margin: 0;
  max-width: 100%;
  order: 0;
}
.gantt-app .app-header .engineer-filter select {
  min-width: 0;
  max-width: 100%;
}
.gantt-app .app-header h1 {
  text-align: center;
}
.gantt-app .app-header .header-actions {
  justify-self: end;
}
@media (max-width: 700px) {
  .gantt-app .app-header {
    grid-template-columns: minmax(0, 1fr) auto auto;
  }
  .gantt-app .app-header .engineer-filter > span {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
  }
  .gantt-app .app-header .header-actions {
    flex-wrap: nowrap;
  }
}
