}

  min-width: 22px;
}
.ticket-row .row-copy {
  flex: 1;
  min-width: 0;
  overflow-wrap: anywhere;
}
.ticket-row small {
  display: block;
  color: var(--muted);
  font-size: 12px;
  margin-top: 2px;
}
.sidebar {
  width: 300px;
  flex: none;
  display: flex;
  flex-direction: column;
  min-height: 0;
  border-right: 1px solid var(--line);
}
.side-tabs {
  padding: 10px 12px;
  flex: none;
}
.side-tabs button {
  flex: 1;
}
.search-label {
  padding: 0 12px 10px;
  display: block;
  flex: none;
}
.search-label input {
  width: 100%;
}
.side-list {
  flex: 1;
  min-height: 100px;
  overflow: auto;
  border-top: 1px solid var(--line);
}
.side-list .ticket-row {
  padding: 9px 12px;
}
.side-detail {
  max-height: 42%;
  overflow: auto;
  padding: 12px;
  border-top: 1px solid var(--line);
}
.side-detail:empty {
  display: none;
}
.playback {
  border-top: 1px solid var(--line);
  padding: 10px 16px;
  flex: none;
}
.playback-heading {
  display: flex;
  gap: 12px;
  align-items: center;
  flex-wrap: wrap;
  margin-bottom: 8px;
}
.playback-heading strong {
  font-size: 13px;
}
.playback-heading span {
  color: var(--muted);
  font-size: 12px;
}
.playback-controls {
  display: flex;
  gap: 10px;
  align-items: center;
  flex-wrap: wrap;
}
.playback-controls input {
  flex: 1;
}
.speed-label {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 12px;
}
.playback-states {
  display: flex;
  gap: 5px 12px;
  flex-wrap: wrap;
  max-height: 46px;
  overflow: auto;
  font-size: 12px;
  color: var(--muted);
  margin-top: 6px;
}
.app-footer {
  padding: 7px 16px;
  color: var(--muted);
  font-size: 11px;
  border-top: 1px solid var(--line);
  flex: none;
}
.mcp-marker {
  background: var(--agent-color,#4338ca);
  border: 2px solid #fff;
  color: #fff;
  border-radius: 18px;
  min-width: 26px;
  min-height: 26px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 2px 6px;
  font-size: 12px;
  box-shadow: 0 1px 4px #0005;
  white-space: nowrap;
}
.mcp-marker[data-kind="agent"] {
  border-radius: 5px;
}
.mcp-marker[data-selected="true"] {
  outline: 3px solid #fbbf24;
  outline-offset: 1px;
}
.map-canvas .amap-logo,.map-canvas .amap-copyright {
  pointer-events: auto;
}
.map-canvas .amap-marker-label {
  border: 0;
  background: transparent;
  padding: 0;
}
.mcp-root[data-mode="fullscreen"] {
  height: 100dvh;
  min-height: 0;
  overflow: hidden;
}
.mcp-root[data-mode="fullscreen"] .map-panel {
  height: auto;
  min-height: 180px;
}
.mcp-root[data-mode="fullscreen"] .gantt-panel {
  height: 0;
  min-height: 180px;
}
.mcp-root[data-mode="fullscreen"] .gantt-scroll {
  height: 0;
  flex: 1;
  min-height: 0;
}
.mcp-root[data-mode="fullscreen"] .inline-detail {
  display: none;
}
.mcp-root[data-mode="fullscreen"] .ordered-tickets {
  display: none;
}
.mcp-root[data-mode="fullscreen"] .app-footer {
  padding-block: 4px;
}
@media (max-width:700px) {
  .brand span {
    display: none;
  }
  .app-header {
    padding: 10px;
    gap: 8px;
  }
  .header-actions button {
    font-size: 12px;
    padding-inline: 7px;
  }
  .toolbar {
    padding: 8px 10px;
    gap: 6px;
  }
  .engineer-filter {
    max-width: 100%;
    flex: 1 0 100%;
    order: 2;
    justify-content: flex-start;
    font-size: 12px;
    margin-left: 0;
  }
  .engineer-filter>span {
    white-space: nowrap;
  }
  .engineer-filter select {
    max-width: none;
    flex: 1;
  }
  .summary-strip {
    grid-template-columns: repeat(3,minmax(0,1fr));
  }
  .summary-item {
    display: flex;
    flex-direction: column;
  }
  .summary-label {
    border-right: 0;
    padding: 6px 8px;
  }
  .summary-value {
    padding: 6px 8px;
    font-size: 14px;
  }
  .summary-score {
    display: grid;
    grid-template-columns: auto minmax(0,1fr);
  }
  .summary-score .summary-value {
    gap: 4px 12px;
  }
  .gantt-heading {
    padding: 8px 10px;
  }
  .gantt-legend .result-phase-key {
    font-size: 12px;
    padding: 1px 5px;
  }
  .sidebar {
    width: 260px;
  }
  .mcp-root[data-mode="fullscreen"] .workspace {
    position: relative;
  }
  .mcp-root[data-mode="fullscreen"] .sidebar {
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    max-width: 88%;
    z-index: 5;
    background: var(--surface);
    box-shadow: 5px 0 18px #0002;
  }
  .playback {
    padding: 8px 10px;
  }
  .playback-controls {
    gap: 6px;
  }
  .playback-controls output {
    font-size: 11px;
    width: 100%;
  }
  .gantt-label {
    width: 125px;
  }
  .task-heading h1 {
    font-size: 15px;
  }
  .map-legend {
    max-height: 54px;
  }
  .detail-grid {
    grid-template-columns: 90px minmax(0,1fr);
  }
}
@media (prefers-reduced-motion:reduce) {
  *,*::before,*::after {
    scroll-behavior: auto !important;
    transition: none !important;
    animation: none !important;
  }
}
