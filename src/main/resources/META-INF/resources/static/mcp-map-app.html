  transform: translateX(-7px);
  border: 2px solid var(--surface);
  border-radius: 50%;
  height: 14px;
  top: calc(50% - 7px);
  background: var(--accent);
  z-index: 1;
}
.gantt-visit-label {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: none;
  font-size: 15px;
}
:root[data-theme="dark"] .gantt-visit {
  color: #6ee7b7;
}
:root[data-theme="dark"] .result-sequence-badge {
  background: #203c36;
}
:root[data-theme="dark"] .result-summary-score-hard {
  color: #fda4af;
}
:root[data-theme="dark"] .result-summary-score-medium {
  color: #fcd34d;
}
:root[data-theme="dark"] .result-summary-score-soft {
  color: #6ee7b7;
}
.gantt-missing {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  gap: 5px;
  flex-wrap: wrap;
  padding: 8px;
}
.gantt-missing button {
  font-size: 12px;
}
.inline-detail {
  padding: 10px 16px;
  border-top: 1px solid var(--line);
  max-height: 150px;
  overflow: auto;
}
.detail-heading {
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
  margin-bottom: 6px;
}
.detail-grid {
  display: grid;
  grid-template-columns: minmax(100px,auto) minmax(0,1fr);
  gap: 0;
  margin: 0;
  border-top: 1px solid var(--line);
}
.detail-grid dt {
  color: var(--muted);
  font-size: 12px;
  background: var(--surface-alt);
  padding: 7px 10px;
  border-bottom: 1px solid var(--line);
}
.detail-grid dd {
  margin: 0;
  overflow-wrap: anywhere;
  font-size: 13px;
  padding: 7px 10px;
  border-bottom: 1px solid var(--line);
}
.ordered-tickets {
  max-height: 175px;
  overflow: auto;
  border-top: 1px solid var(--line);
}
.ticket-row {
  width: 100%;
  display: flex;
  align-items: flex-start;
  gap: 10px;
  text-align: left;
  border: 0;
  border-radius: 0;
  border-bottom: 1px solid var(--line);
  padding: 9px 16px;
}
.ticket-row:last-child {
  border-bottom: 0;
}
.ticket-row .number {
  font-family: ui-monospace,monospace;
  font-variant-numeric: tabular-nums;
  color: var(--muted);
  min-width: 22px;
}
.ticket-row .row-copy {
  flex: 1;
  min-width: 0;
  overflow-wrap: anywhere;
}
.ticket-row small {
  display: block;
  color: var(--muted);
  font-size: 12px;
  margin-top: 2px;
}
.sidebar {
  width: 300px;
  flex: none;
  display: flex;
  flex-direction: column;
  min-height: 0;
  border-right: 1px solid var(--line);
}
.gantt-app .sidebar {
  order: 2;
  border-right: 0;
  border-left: 1px solid var(--line);
}
.side-tabs {
  padding: 10px 12px;
  flex: none;
}
.side-tabs button {
  flex: 1;
}
.search-label {
  padding: 0 12px 10px;
  display: block;
  flex: none;
}
.search-label input {
  width: 100%;
}
.side-list {
  flex: 1;
  min-height: 100px;
  overflow: auto;
  border-top: 1px solid var(--line);
}
.side-list .ticket-row {
  padding: 9px 12px;
}
.side-detail {
  max-height: 42%;
  overflow: auto;
  padding: 12px;
  border-top: 1px solid var(--line);
}
.side-detail:empty {
  display: none;
}
.playback {
  border-top: 1px solid var(--line);
  padding: 10px 16px;
  flex: none;
}
.playback-heading {
  display: flex;
  gap: 12px;
  align-items: center;
  flex-wrap: wrap;
  margin-bottom: 8px;
}
.playback-heading strong {
  font-size: 13px;
}
.playback-heading span {
  color: var(--muted);
  font-size: 12px;
}
.playback-controls {
  display: flex;
  gap: 10px;
  align-items: center;
  flex-wrap: wrap;
}
.playback-controls input {
  flex: 1;
}
.speed-label {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 12px;
}
.playback-states {
  display: flex;
  gap: 5px 12px;
  flex-wrap: wrap;
  max-height: 46px;
  overflow: auto;
  font-size: 12px;
  color: var(--muted);
  margin-top: 6px;
}
.app-switch {
  padding: 9px 16px;
  border-top: 1px solid var(--line);
  display: flex;
  gap: 10px;
  align-items: flex-start;
  flex-wrap: wrap;
}
.app-switch>div {
  display: flex;
  gap: 8px;
  flex: 1;
  min-width: min(100%,320px);
}
.app-switch textarea {
  flex: 1;
  min-width: 180px;
  resize: vertical;
  border: 1px solid var(--line);
  background: var(--surface-alt);
  color: var(--ink);
  padding: 7px;
  font: 11px ui-monospace,monospace;
}
.map-warning {
  background: #162535;
  color: #e2e8f0;
  padding: 5px 8px;
  font-size: 12px;
}
.mcp-marker {
  background: var(--agent-color,#4338ca);
  border: 2px solid #fff;
  color: #fff;
  border-radius: 18px;
  min-width: 26px;
  min-height: 26px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 2px 6px;
  font-size: 12px;
  box-shadow: 0 1px 4px #0005;
  white-space: nowrap;
}
.mcp-marker[data-kind="agent"] {
  border-radius: 5px;
}
.mcp-marker[data-selected="true"] {
  outline: 3px solid #fbbf24;
  outline-offset: 1px;
}
.map-canvas .amap-logo,.map-canvas .amap-copyright {
  pointer-events: auto;
}
.map-canvas .amap-marker-label {
  border: 0;
  background: transparent;
  padding: 0;
}
.mcp-root[data-mode="fullscreen"] {
  height: 100dvh;
  min-height: 0;
  overflow: hidden;
}
.mcp-root[data-mode="fullscreen"] .map-panel {
  height: auto;
  min-height: 180px;
}
.mcp-root[data-mode="fullscreen"] .gantt-panel {
  height: 0;
  min-height: 180px;
}
.mcp-root[data-mode="fullscreen"] .gantt-scroll {
  height: 0;
  flex: 1;
  min-height: 0;
}
.mcp-root[data-mode="fullscreen"] .inline-detail {
  display: none;
}
.mcp-root[data-mode="fullscreen"] .ordered-tickets {
  display: none;
}
@media (max-width:700px) {
  .app-header {
    padding: 10px;
    gap: 8px;
  }
  .header-actions button {
    font-size: 12px;
    padding-inline: 7px;
  }
  .toolbar {
    padding: 8px 10px;
    gap: 6px;
  }
  .engineer-filter {
    max-width: 100%;
    flex: 1 0 100%;
    order: 2;
    justify-content: flex-start;
    font-size: 12px;
    margin-left: 0;
  }
  .engineer-filter>span {
    white-space: nowrap;
  }
  .engineer-filter select {
    max-width: none;
    flex: 1;
  }
  .map-app .engineer-filter {
    flex: 1 0 100%;
    order: 0;
  }
  .map-app[data-mode="inline"] .map-panel {
    aspect-ratio: 1;
  }
  .summary-strip {
    grid-template-columns: repeat(3,minmax(0,1fr));
  }
  .summary-item {
    display: flex;
    flex-direction: column;
  }
  .summary-label {
    border-right: 0;
    padding: 6px 8px;
  }
  .summary-value {
    padding: 6px 8px;
    font-size: 14px;
  }
  .summary-score {
    display: grid;
    grid-template-columns: auto minmax(0,1fr);
  }
  .summary-score .summary-value {
    gap: 4px 12px;
  }
  .gantt-heading {
    padding: 8px 10px;
  }
  .gantt-heading .engineer-filter {
    flex: 0 1 140px;
    max-width: 50%;
    order: 0;
    margin-left: auto;
  }
  .gantt-heading .engineer-filter>span {
    display: none;
  }
  .gantt-legend .result-phase-key {
    font-size: 12px;
    padding: 1px 5px;
  }
  .sidebar {
    width: 260px;
  }
  .mcp-root[data-mode="fullscreen"] .workspace {
    position: relative;
  }
  .mcp-root[data-mode="fullscreen"] .sidebar {
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    max-width: 88%;
    z-index: 5;
    background: var(--surface);
    box-shadow: 5px 0 18px #0002;
  }
  .playback {
    padding: 8px 10px;
  }
  .playback-controls {
    gap: 6px;
  }
  .playback-controls output {
    font-size: 11px;
    width: 100%;
  }
  .task-heading h1 {
    font-size: 15px;
  }
  .map-legend {
    padding-inline: 10px;
  }
  .detail-grid {
    grid-template-columns: 90px minmax(0,1fr);
  }
}
@media (prefers-reduced-motion:reduce) {
  *,*::before,*::after {
    scroll-behavior: auto !important;
    transition: none !important;
    animation: none !important;
  }
}

      <button type="button" id="fit-map" class="map-fit-button" aria-label="显示完整路线" aria-describedby="fit-map-tip">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <path d="M8 4H4v4m12-4h4v4M4 16v4h4m12-4v4h-4"/>
          <path d="m8 15 3-5 5 3"/>

    <div class="header-actions"><button type="button" id="refresh" hidden disabled>刷新</button><button type="button" id="fullscreen" disabled>全屏查看</button></div>
  </div>
  <div class="workspace"><aside id="sidebar" class="sidebar" hidden><div class="side-tabs" role="tablist" aria-label="对象类型"><button type="button" id="side-agents" role="tab" aria-selected="true" aria-controls="side-list">工程师</button><button type="button" id="side-tickets" role="tab" aria-selected="false" aria-controls="side-list" tabindex="-1">工单</button></div><label class="search-label"><span class="sr-only" id="search-label">检索</span><input id="search" type="search" aria-labelledby="search-label" autocomplete="off"></label><div id="side-list" class="side-list" role="tabpanel"></div><div id="side-detail" class="side-detail"></div></aside>

  </div>
  <section id="playback" class="playback" aria-label="规划回放" hidden><div class="playback-heading"><strong id="playback-label">规划回放 · 非实时位置</strong><span id="playback-scope"></span></div><div class="playback-controls"><button type="button" id="play" disabled>播放</button><button type="button" id="follow" aria-pressed="false" disabled>跟随焦点</button><label class="speed-label"><span id="speed-label">速度</span><select id="speed" aria-labelledby="speed-label"><option value="1">1×</option><option value="10">10×</option><option value="60">60×</option><option value="300">300×</option></select></label><input id="cursor" type="range" min="0" max="1000" value="0" aria-label="规划时间" disabled><output id="playback-time" class="metadata">—</output></div></section>
