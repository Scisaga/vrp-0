.gantt-tick:last-child {
  transform: translateX(-100%);
}
.gantt-row {
  display: flex;
  height: 76px;
  border-bottom: 1px solid var(--line);
}
.gantt-row .gantt-label {
  display: flex;
  flex-direction: column;
  justify-content: center;
}
.gantt-row[data-selected="true"] .gantt-label {
  background: var(--accent-soft);
}
.gantt-row[data-selected="true"] .gantt-label button {
  background: transparent;
}
.gantt-track {
  position: relative;
  flex: 1;
  min-width: 0;
  height: 75px;
  margin-right: 16px;
}
.gantt-gridline {
  position: absolute;
  top: 0;
  bottom: 0;
  width: 1px;
  background: var(--gantt-grid);
  pointer-events: none;
}
.gantt-visit {
  position: absolute;
  top: 21px;
  height: 44px;
}
.gantt-bar {
  position: absolute;
  top: 0;
  height: 44px;
  min-height: 0;
  min-width: 0;
  padding: 0;
  border: 0;
  border-radius: 0;
  box-shadow: none;
  color: var(--gantt-service-ink);
  font-variant-numeric: tabular-nums;
  text-align: left;
  background: transparent;
}
.gantt-bar[data-phase="service"] {
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 2px;
  overflow: hidden;
  padding: 4px 0;
  border-radius: 2px;
  background: var(--gantt-service);
  box-shadow: inset 3px 0 var(--gantt-service-edge);
  z-index: 1;
}
.gantt-bar[data-phase="service"]:hover {
  background: var(--gantt-service);
  box-shadow: inset 3px 0 var(--gantt-travel),inset 0 0 0 1px var(--gantt-service-edge);
}
.gantt-bar[data-phase="service"][aria-pressed="true"] {
  background: var(--accent-soft);
  color: var(--accent);
  box-shadow: inset 3px 0 var(--accent),inset 0 0 0 1px var(--accent);
}
.gantt-location,.gantt-duration {
  display: block;
  margin-inline: 10px 7px;
  max-width: calc(100% - 17px);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  line-height: 16px;
  pointer-events: none;
}
.gantt-location {
  font-size: 11.5px;
  font-weight: 600;
}
.gantt-duration {
  font-size: 11px;
}
.gantt-bar[data-narrow="true"] .gantt-location,.gantt-bar[data-narrow="true"] .gantt-duration {
  margin-inline: 5px 3px;
  max-width: calc(100% - 8px);
}
.gantt-bar[data-narrow="true"] .gantt-location {
  font-size: 10px;
}
.gantt-bar[data-narrow="true"] .gantt-duration {
  font-size: 9px;
}
.gantt-bar[data-phase="travel"],.gantt-bar[data-phase="travel"]:hover,.gantt-bar[data-phase="travel"][aria-pressed="true"] {
  background: transparent;
  color: var(--gantt-travel);
  border: 0;
  box-shadow: none;
  z-index: 2;
}
.gantt-travel-line {
  position: absolute;
  left: 0;
  right: 0;
  top: 23px;
  height: 3px;
  background: var(--gantt-travel);
  pointer-events: none;
}
.gantt-travel-label {
  position: absolute;
  left: 0;
  top: -19px;
  display: inline-flex;
  align-items: center;
  gap: 3px;
  height: 19px;
  white-space: nowrap;
  font-size: 10px;
  line-height: 19px;
  border: 0;
  background: transparent;
  box-shadow: none;
  padding: 0;
}
.gantt-travel-label svg {
  width: 12px;
  height: 12px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.6;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.gantt-bar[data-phase="waiting"],.gantt-bar[data-phase="waiting"]:hover,.gantt-bar[data-phase="waiting"][aria-pressed="true"] {
  top: 8px;
  height: 28px;
  overflow: hidden;
  color: var(--gantt-wait-ink);
  background: repeating-linear-gradient(-45deg,var(--gantt-wait) 0 3px,var(--gantt-hatch) 3px 4px);
  text-align: center;
}
.gantt-wait-label {
  display: inline-block;
  font-size: 10px;
  line-height: 28px;
  white-space: nowrap;
  pointer-events: none;
}
.gantt-bar:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
  z-index: 3;
}
.gantt-bar[data-zero="true"] {
  width: 14px !important;
  min-width: 14px;
  transform: translateX(-7px);
  border: 2px solid var(--surface);
  border-radius: 50%;
  height: 14px;
  top: 15px;
  padding: 0;
  background: var(--gantt-service-edge);
  box-shadow: none;
  z-index: 2;
}
:root[data-theme="dark"] .result-sequence-badge {
  background: #203c36;
}
:root[data-theme="dark"] .result-summary-score-hard {
  color: #fda4af;
}
:root[data-theme="dark"] .result-summary-score-medium {
  color: #fcd34d;
}
:root[data-theme="dark"] .result-summary-score-soft {
  color: #6ee7b7;
}
.gantt-missing {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  gap: 5px;
  flex-wrap: wrap;
  padding: 8px;
}
.gantt-missing button {
  font-size: 12px;
}
.inline-detail {
  padding: 10px 16px;
  border-top: 1px solid var(--line);
  max-height: 150px;
  overflow: auto;
}
.gantt-app .inline-detail {
  max-height: 230px;
}
.gantt-ticket-detail>.detail-heading {
  font-family: ui-monospace,monospace;
  font-size: 12px;
  font-weight: 500;
  overflow-wrap: anywhere;
}
@media (min-width:760px) {
  .gantt-app .inline-detail .detail-grid {
    grid-template-columns: 110px minmax(0,1fr) 110px minmax(0,1fr);
  }
  .gantt-app .inline-detail.gantt-ticket-detail .detail-grid dd:first-of-type {
    grid-column: span 3;
  }
}
.detail-heading {
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
  margin-bottom: 6px;
}
.detail-grid {
  display: grid;
  grid-template-columns: minmax(100px,auto) minmax(0,1fr);
  gap: 0;
  margin: 0;
  border-top: 1px solid var(--line);
}
.detail-grid dt {
  color: var(--muted);
  font-size: 12px;
  background: var(--surface-alt);
  padding: 7px 10px;
  border-bottom: 1px solid var(--line);
}
.detail-grid dd {
  margin: 0;
  overflow-wrap: anywhere;
  font-size: 13px;
  padding: 7px 10px;
  border-bottom: 1px solid var(--line);
}
.ordered-tickets {
  max-height: 175px;
  overflow: auto;
  border-top: 1px solid var(--line);
}
.ticket-row {
  width: 100%;
  display: flex;
  align-items: flex-start;
  gap: 10px;
  text-align: left;
  border: 0;
  border-radius: 0;
  border-bottom: 1px solid var(--line);
  padding: 9px 16px;
}
.ticket-row:last-child {
  border-bottom: 0;
}
.ticket-row .number {
  font-family: ui-monospace,monospace;
  font-variant-numeric: tabular-nums;
  color: var(--muted);
  min-width: 22px;
}
.ticket-row .row-copy {
  flex: 1;
  min-width: 0;
  overflow-wrap: anywhere;
}
.ticket-row small {
  display: block;
  color: var(--muted);
  font-size: 12px;
  margin-top: 2px;
}
.sidebar {
  width: 300px;
  flex: none;
  display: flex;
  flex-direction: column;
  min-height: 0;
  border-right: 1px solid var(--line);
}
.gantt-app .sidebar {
  order: 2;
  border-right: 0;
  border-left: 1px solid var(--line);
}
.side-tabs {
  padding: 10px 12px;
  flex: none;
}
.side-tabs button {
  flex: 1;
}
.search-label {
  padding: 0 12px 10px;
  display: block;
  flex: none;
}
.search-label input {
  width: 100%;
}
.side-list {
  flex: 1;
  min-height: 100px;
  overflow: auto;
  border-top: 1px solid var(--line);
}
.side-list .ticket-row {
  padding: 9px 12px;
}
.side-detail {
  max-height: 42%;
  overflow: auto;
  padding: 12px;
  border-top: 1px solid var(--line);
}
.side-detail:empty {
  display: none;
}
.playback {
  border-top: 1px solid var(--line);
  padding: 10px 16px;
  flex: none;
}
.playback-heading {
  display: flex;
  gap: 12px;
  align-items: center;
  flex-wrap: wrap;
  margin-bottom: 8px;
}
.playback-heading strong {
  font-size: 13px;
}
.playback-heading span {
  color: var(--muted);
  font-size: 12px;
}
.playback-controls {
  display: flex;
  gap: 10px;
  align-items: center;
  flex-wrap: wrap;
}
.playback-controls input {
  flex: 1;
}
.speed-label {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 12px;
}
.playback-states {
  display: flex;
  gap: 5px 12px;
  flex-wrap: wrap;
  max-height: 46px;
  overflow: auto;
  font-size: 12px;
  color: var(--muted);
  margin-top: 6px;
}
.app-switch {
  padding: 9px 16px;
  border-top: 1px solid var(--line);
  display: flex;
  gap: 10px;
  align-items: flex-start;
  flex-wrap: wrap;
}
.app-switch>div {
  display: flex;
  gap: 8px;
  flex: 1;
  min-width: min(100%,320px);
}
.app-switch textarea {
  flex: 1;
  min-width: 180px;
  resize: vertical;
  border: 1px solid var(--line);
  background: var(--surface-alt);
  color: var(--ink);
  padding: 7px;
  font: 11px ui-monospace,monospace;
}
.map-warning {
  background: #162535;
  color: #e2e8f0;
  padding: 5px 8px;
  font-size: 12px;
}
.mcp-marker {
  background: var(--agent-color,#4338ca);
  border: 2px solid #fff;
  color: #fff;
  border-radius: 18px;
  min-width: 26px;
  min-height: 26px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 2px 6px;
  font-size: 12px;
  box-shadow: 0 1px 4px #0005;
  white-space: nowrap;
}
.mcp-marker[data-kind="agent"] {
  border-radius: 5px;
}
.mcp-marker[data-selected="true"] {
  outline: 3px solid #fbbf24;
  outline-offset: 1px;
}
.map-canvas .amap-logo,.map-canvas .amap-copyright {
  pointer-events: auto;
}
.map-canvas .amap-marker-label {
  border: 0;
  background: transparent;
  padding: 0;
}
.mcp-root[data-mode="fullscreen"] {
  height: 100dvh;
  min-height: 0;
  overflow: hidden;
}
.mcp-root[data-mode="fullscreen"] .map-panel {
  height: auto;
  min-height: 180px;
}
.mcp-root[data-mode="fullscreen"] .gantt-panel {
  height: 0;
  min-height: 180px;
}
.mcp-root[data-mode="fullscreen"] .gantt-scroll {
  height: 0;
  flex: 1;
  min-height: 0;
}
.mcp-root[data-mode="fullscreen"] .inline-detail {
  display: none;
}
.mcp-root[data-mode="fullscreen"] .ordered-tickets {
  display: none;
}
@media (max-width:700px) {
  .app-header {
    padding: 10px;
    gap: 8px;
  }
  .header-actions button {
    font-size: 12px;
    padding-inline: 7px;
  }
  .toolbar {
    padding: 8px 10px;
    gap: 6px;
  }
  .engineer-filter {
    max-width: 100%;
    flex: 1 0 100%;
    order: 2;
    justify-content: flex-start;
    font-size: 12px;
    margin-left: 0;
  }
  .engineer-filter>span {
    white-space: nowrap;
  }
  .engineer-filter select {
    max-width: none;
    flex: 1;
  }
  .map-app .engineer-filter {
    flex: 1 0 100%;
    order: 0;
  }
  .map-app[data-mode="inline"] .map-panel {
    aspect-ratio: 1;
  }
  .summary-strip {
    grid-template-columns: repeat(3,minmax(0,1fr));
  }
  .summary-item {
    display: flex;
    flex-direction: column;
  }
  .summary-label {
    border-right: 0;
    padding: 6px 8px;
  }
  .summary-value {
    padding: 6px 8px;
    font-size: 14px;
  }
  .summary-score {
    display: grid;
    grid-template-columns: auto minmax(0,1fr);
  }
  .summary-score .summary-value {
    gap: 4px 12px;
  }
  .gantt-heading {
    padding: 8px 10px;
  }
  .gantt-heading .engineer-filter {
    flex: 0 1 140px;
    max-width: 50%;
    order: 0;
    margin-left: auto;
  }
  .gantt-heading .engineer-filter>span {
    display: none;
  }
  .gantt-legend {
    gap: 5px 10px;
  }
  .sidebar {
    width: 260px;
  }
  .mcp-root[data-mode="fullscreen"] .workspace {
    position: relative;
  }
  .mcp-root[data-mode="fullscreen"] .sidebar {
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    max-width: 88%;
    z-index: 5;
    background: var(--surface);
    box-shadow: 5px 0 18px #0002;
  }
  .playback {
    padding: 8px 10px;
  }
  .playback-controls {
    gap: 6px;
  }
  .playback-controls output {
    font-size: 11px;
    width: 100%;
  }
  .task-heading h1 {
    font-size: 15px;
  }
  .map-legend {
    padding-inline: 10px;
  }
  .detail-grid {
    grid-template-columns: 90px minmax(0,1fr);
  }
}
@media (prefers-reduced-motion:reduce) {
  *,*::before,*::after {
    scroll-behavior: auto !important;
    transition: none !important;
    animation: none !important;
  }
}

        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <path d="M8 4H4v4m12-4h4v4M4 16v4h4m12-4v4h-4"/>

  </div>
