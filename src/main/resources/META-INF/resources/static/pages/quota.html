<div x-data="quotaPage" x-init="init()" class="responsive-page-root">
  <div class="flex-1 min-h-0 min-[1600px]:overflow-hidden">
    <div class="flex min-h-full flex-col gap-0 min-[1600px]:h-full">
      <template x-if="notice">
        <div class="shrink-0 rounded-[0.46875rem] border-[1.25px] border-emerald-500/30 bg-emerald-500/10 px-[1.25rem] py-[0.9375rem] text-[1.09375rem]/[1.5625rem] text-emerald-700">
          <div class="flex items-center justify-between gap-[0.9375rem]">
            <span x-text="notice"></span>
            <button type="button" class="shrink-0 text-slate-700 hover:text-slate-900" @click="clearNotice()" :aria-label="t('common.close')">
              <span class="material-symbols-rounded text-[22.5px]">close</span>
            </button>
          </div>
        </div>
      </template>
      <template x-if="error">
        <div class="shrink-0 rounded-[0.46875rem] border-[1.25px] border-rose-500/30 bg-rose-500/10 px-[1.25rem] py-[0.9375rem] text-[1.09375rem]/[1.5625rem] text-rose-700">
          <div class="flex items-center justify-between gap-[0.9375rem]">
            <span x-text="error"></span>
            <button type="button" class="shrink-0 text-slate-700 hover:text-slate-900" @click="clearError()" :aria-label="t('common.close')">
              <span class="material-symbols-rounded text-[22.5px]">close</span>
            </button>
          </div>
        </div>
      </template>

      <div class="responsive-workspace flex-1 min-[1600px]:grid-cols-[minmax(0,1fr)_360px]">
        <section class="responsive-workspace-main panel-shell">
          <div class="shrink-0 border-b-[1.25px] border-slate-200 px-[1.25rem] py-[0.9375rem]">
            <h2 class="text-[1.09375rem]/[1.5625rem] font-semibold text-slate-900" x-text="t('quota.section.address')"></h2>
          </div>

          <div class="panel-scroll">
            <div class="divide-y-[1.25px] divide-slate-200">
                <div class="grid gap-0 min-[960px]:grid-cols-[minmax(15rem,24rem)_minmax(22rem,1fr)]">
                  <label class="block border-b-[1.25px] border-slate-200 px-[1.25rem] py-[0.9375rem] min-[960px]:border-r-[1.25px] min-[960px]:border-b-0">
                    <div class="field-label" x-text="t('quota.geocodingProvider')"></div>
                    <select class="field-input field-input-enum mt-[0.15625rem]" x-model="form.geocodeProvider">
                      <option value="AMAP">AMAP</option>
                      <option value="ADDR_RESOLVER">ADDR_RESOLVER</option>
                    </select>
                  </label>

                  <div class="flex items-center px-[1.25rem] py-[0.9375rem]">
                    <label class="flex min-h-[37.5px] w-full items-start justify-between gap-[0.9375rem]">
                      <span class="field-switch-copy">
                        <span class="field-switch-title block" x-text="t('quota.fallbackTitle')"></span>
                        <span class="field-switch-note block" x-text="t('quota.fallbackHint')"></span>
                      </span>
                      <span class="relative inline-flex shrink-0 items-center" style="transform: scale(0.88); transform-origin: right center;">
                        <input type="checkbox" class="field-switch-input" x-model="form.addressResolverFallbackToAmap">
                        <span class="field-switch-control" aria-hidden="true"></span>
                      </span>
                    </label>
                  </div>
                </div>

                <label class="block px-[1.25rem] py-[0.9375rem]">
                  <div class="field-label" x-text="t('quota.addressResolverUrl')"></div>
                  <input class="field-input mt-[0.15625rem]" x-model="form.addressResolverUrl" placeholder="http://127.0.0.1:5000/api/resolve">
                  <div class="mt-[0.625rem] text-[0.9375rem]/[1.25rem] text-slate-600" x-text="t('quota.addressResolverHint')"></div>
                </label>

              <section>
                <div class="px-[1.25rem] py-[0.9375rem]">
                  <h2 class="text-[1.09375rem]/[1.5625rem] font-semibold text-slate-900" x-text="t('quota.section.authentication')"></h2>
                </div>
                <div class="border-t-[1.25px] border-slate-200 px-[1.25rem] py-[0.9375rem]">
                  <label for="quota-api-key" class="field-label" x-text="t('quota.apiKey')"></label>
                  <div class="relative mt-[0.15625rem] max-w-[36rem]">
                    <input id="quota-api-key" class="field-input pr-[3.4375rem]" :type="showApiKey ? 'text' : 'password'" x-model="form.key" autocomplete="off" :placeholder="t('quota.apiKeyPlaceholder')">
                    <button type="button" class="ui-tooltip absolute inset-y-0 right-0 inline-flex w-[3.125rem] items-center justify-center text-slate-600 hover:text-slate-900 focus-visible:outline-none focus-visible:ring-[2.5px] focus-visible:ring-inset focus-visible:ring-emerald-600/25" @click="toggleApiKeyVisibility()" :aria-label="t(showApiKey ? 'quota.hideApiKey' : 'quota.showApiKey')" :data-tooltip="t(showApiKey ? 'quota.hideApiKey' : 'quota.showApiKey')">
                      <span class="material-symbols-rounded text-[22.5px]" aria-hidden="true" x-text="showApiKey ? 'visibility_off' : 'visibility'"></span>
                    </button>
                  </div>
                </div>
              </section>

              <section>
                <div class="px-[1.25rem] py-[0.9375rem]">
                  <h2 class="text-[1.09375rem]/[1.5625rem] font-semibold text-slate-900" x-text="t('quota.section.limits')"></h2>
                </div>
                <div class="grid grid-cols-1 gap-x-[2.5rem] gap-y-[0.9375rem] border-t-[1.25px] border-slate-200 px-[1.25rem] py-[0.9375rem] min-[640px]:grid-cols-2 min-[1100px]:grid-cols-4">
                  <label class="block min-w-0">
                    <div class="field-label" x-text="t('quota.qps')"></div>
                    <input type="number" min="1" class="field-input field-input-number mt-[0.15625rem]" x-model="form.qps">
                  </label>
                  <label class="block min-w-0">
                    <div class="field-label" x-text="t('quota.total')"></div>
                    <input type="number" min="1" class="field-input field-input-number mt-[0.15625rem]" x-model="form.quota">
                  </label>
                  <label class="block min-w-0">
                    <div class="field-label" x-text="t('quota.interval')"></div>
                    <input type="number" min="1" class="field-input field-input-number mt-[0.15625rem]" x-model="form.intervalSeconds">
                  </label>
                  <label class="block min-w-0">
                    <div class="field-label" x-text="t('quota.timeout')"></div>
                    <input type="number" min="1" class="field-input field-input-number mt-[0.15625rem]" x-model="form.waitTimeoutSeconds">
                  </label>
                </div>
              </section>

            </div>
          </div>
          <div class="flex shrink-0 justify-end border-t-[1.25px] border-slate-200 px-[1.25rem] py-[0.46875rem]">
            <button type="button" class="action-primary" @click="save()" :disabled="saving">
              <span class="material-symbols-rounded text-[22.5px]" aria-hidden="true">save</span>
              <span x-text="t('quota.save')"></span>
            </button>
          </div>
        </section>

        <aside class="responsive-workspace-aside panel-shell border-t-0 min-[1600px]:border-l-0">
          <section class="flex shrink-0 flex-col">
            <div class="px-[1.25rem] py-[0.9375rem]">
              <div class="field-label" x-text="t('quota.preview')"></div>
            </div>
            <div class="max-h-[21.875rem] overflow-auto border-t-[1.25px] border-slate-200 p-[0.9375rem] font-mono text-[0.9375rem]/[1.25rem] text-slate-700 overscroll-contain">
              <pre class="w-full max-w-full overflow-x-hidden whitespace-pre-wrap break-all" style="white-space: pre-wrap; overflow-wrap: anywhere; word-break: break-word;" x-text="JSON.stringify({
  key: maskedApiKey(),
  qps: Number(form.qps),
  quota: Number(form.quota),
  interval_seconds: Number(form.intervalSeconds),
  wait_timeout_seconds: Number(form.waitTimeoutSeconds),
  geocode_provider: form.geocodeProvider,
  address_resolver_url: form.addressResolverUrl,
  address_resolver_fallback_to_amap: Boolean(form.addressResolverFallbackToAmap)
}, null, 2)"></pre>
            </div>
          </section>

          <section class="flex shrink-0 flex-col border-t-[1.25px] border-slate-200">
            <div class="px-[1.25rem] py-[0.9375rem]">
              <div class="field-label" x-text="t('quota.notes')"></div>
            </div>
            <div class="divide-y-[1.25px] divide-slate-200 border-t-[1.25px] border-slate-200 text-[1.09375rem]/[1.5625rem] text-slate-600">
              <div class="px-[1.25rem] py-[0.9375rem]" x-text="t('quota.note.persist')"></div>
              <div class="px-[1.25rem] py-[0.9375rem]" x-text="t('quota.note.amap')"></div>
              <div class="px-[1.25rem] py-[0.9375rem]" x-text="t('quota.note.provider')"></div>
            </div>
          </section>
        </aside>
      </div>
    </div>
  </div>
</div>
