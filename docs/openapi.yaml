            $ref: '#/components/schemas/Photo'
        gridcode:
          description: ' poi 的地理格 id'
          type: string
        typecode:
          description: 分类编码
          type: string
        citycode:
          description: 所属城市编码
          type: string
        adname:
          description: 所属区域名称
          type: string
        entr_location:
          description: 入口经纬度坐标
          type: string
        entr_loc:
          $ref: '#/components/schemas/LOC'
        adcode:
          description: 所属区域编码
          type: string
        pname:
          description: 所属省份名称
          type: string
        cityname:
          description: 所属城市名称
          type: string
    Photo:
      type: object
      properties:
        title:
          type: string
        url:
          type: string
    RecordType:
      enum:
      - BEST_SOLUTION
      - SEARCH_SAMPLE
      - FINAL_SOLUTION
      type: string
    Route:
      type: object
      properties:
        origin:
          description: 路线起点
