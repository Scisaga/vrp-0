          type: array
          items:
            $ref: '#/components/schemas/RoutingFailure'
    RoutePlan:
      required:
      - depos
      - agents
      - tickets
      type: object
      properties:
        skus:
          type: array
          items:
            $ref: '#/components/schemas/SKU'
        pois:
          description: 地址信息
          type: array
          items:
            $ref: '#/components/schemas/POI'
        depos:
          description: 仓库地址
          type: array
          items:
            $ref: '#/components/schemas/Depo'
        agents:
          description: 工程师/车辆列表
          type: array
          items:
            $ref: '#/components/schemas/AgentEachDay'
        tickets:
          description: 工单列表
          type: array
          items:
            $ref: '#/components/schemas/Ticket'
        matrix:
          description: 迁移矩阵
          type: object
          allOf:
          - $ref: '#/components/schemas/TransitMatrix'
        constraint_configuration:
          description: 约束配置项
          type: object
          allOf:
          - $ref: '#/components/schemas/RoutePlanConstraintConfiguration'
        cost_parameter:
          description: 成本参数
          type: object
          allOf:
          - $ref: '#/components/schemas/CostParameter'
        score:
          description: 规划评分
          type: string
          example: 0hard/-5medium/-79909soft
        score_explanation:
          description: 求解解释，内部字段，不需要传参
          type: string
        metrics:
          type: object
          allOf:
          - $ref: '#/components/schemas/Metrics'
          readOnly: true
    RoutePlanConstraintConfiguration:
      type: object
      properties:
        name:
          type: string
        车辆装载容量限制:
          description: agent装载不能超过其设计上限，相关字段：agent.weight、agent.vol，默认惩罚：1 Hard
          type: string
        最大接单:
          description: agent最大接单量不应大于设置值，相关字段：agent.max_ticket_num，默认惩罚：1 Hard
          type: string
        标签匹配:
          description: 所指派agent的标签包含ticket标签，相关字段：agent.skills、ticket.skillsRequired，默认惩罚：1
            Hard
          type: string
        需求技能等级匹配:
          description: agent等级与ticket等级相匹配，相关字段：agent.qualificationLevels、ticket.qualificationLevelsRequired，默认惩罚：100
            medium
          type: string
        工单时序因果依赖:
          description: 下一级ticket的完成时间必须晚于上级ticket，相关字段：ticket.dep_tickets、ticket.ref_tickets，默认惩罚：0
            Hard（未启用）
          type: string
        工单工程师依赖:
          description: 下一级ticket与上级ticket必须分配给同一agent，相关字段：ticket.dep_tickets、ticket.ref_tickets、ticket.agent_id，默认惩罚：0
            Hard（未启用）
          type: string
        工单截止时间:
          description: ticket完成不能晚于最后截止时间，相关字段：ticket.max_end_time，默认惩罚：0 Hard（未启用）
          type: string
        时间窗约束:
          description: ticket在客户预期时间上门，相关字段：ticket.min_start_time、ticket.max_end_time，默认惩罚：100
            Soft（每分钟）
          type: string
        当日指派:
          description: ticket必须在当日指派工程师，相关字段：ticket.create_time，默认惩罚：1 Hard
          type: string
        关联工单相同指派:
          description: ticket与其关联ticket尽量派发给相同工程师，相关字段：ticket.relation_tickets，默认惩罚：50
            Medium
          type: string
        最小行驶时间:
          description: 所有agent的总在途时间尽可能小，默认惩罚：1 Soft（每分钟）
          type: string
        最化行驶距离:
          description: 所有agent的总在途里程尽可能小，默认惩罚：0 Soft（每米）（未启用）
          type: string
        最小固定成本:
          description: 总固定成本最小，默认惩罚：20 Soft（每元）
          type: string
        工单工程师同网点:
          description: ticket只能指派给同网点的agent，相关字段：agent.depo_id、ticket.depo_id，默认惩罚：1
            Hard
          type: string
        工单负载均衡:
          description: 分配给每个agent的ticket应差异不大，相关字段：agent.tickets，默认惩罚：1 Medium
          type: string
        负载比例均衡:
          description: 每个agent的有效载荷使用比例应该差异不大，默认惩罚：0 Medium（未启用）
          type: string
        工作时长负载均衡:
          description: 每个agent的预期工作时长应该差异不大，默认惩罚：0 Medium（未启用）
          type: string
        最小工单变更:
          description: 尽量不要改派已经分配的工单，默认惩罚：1000 Soft
          type: string
        虚拟工程师:
          description: 超约束优化时使用，需要权衡业务场景和客户需求设计惩罚值。如果违背时间窗约束带来的惩罚大于虚拟工程师的惩罚，求解时倾向于虚拟工程师指派，也就是说该工单不进行配送，反之亦然。默认惩罚：1000
            Medium
          type: string
    RouteSource:
