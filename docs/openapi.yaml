          type: number
    LocalDate:
      format: date
      description: 必须严格使用 yyyy-MM-dd，并且是有效日历日期；不包含时间或时区
      pattern: ^[0-9]{4}-(?:0[1-9]|1[0-2])-(?:0[1-9]|[12][0-9]|3[01])$
      type: string
      example: '2022-03-10'
    LocalDateTime:
      description: 必须严格使用 yyyy-MM-dd HH:mm:ss，并且日期和时间有效；日期与时间之间使用空格，不得使用字母 T，不包含时区或 UTC 偏移
      pattern: ^[0-9]{4}-(?:0[1-9]|1[0-2])-(?:0[1-9]|[12][0-9]|3[01]) (?:[01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]$
      type: string
      example: '2022-03-10 12:15:50'
    MapContext:
