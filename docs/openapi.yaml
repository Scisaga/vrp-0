          description: 仓库名称
          type: string
    Duration:
      format: duration
      description: 必须传 ISO-8601 duration 字符串（Java Duration 格式），不得传数字；支持日、小时、分钟、秒，不支持年或月，例如 PT30M 表示 30 分钟
      type: string
      example: 'PT30M'
    ErrorInfo:
      description: 统一 REST 错误响应。网页客户端使用 error_code 和 error_params 本地化展示，message 仅保留给兼容客户端和诊断。
      type: object
      properties:
        id:
          $ref: '#/components/schemas/UUID'
        error_code:
          description: 稳定、面向机器的错误码
          type: string
        error_params:
          description: 错误码插值所需的非敏感参数
          type: object
          additionalProperties:
            type: string
        message:
          description: 向后兼容的服务端诊断消息；网页不得直接展示
          type: string
    ExtendedClassInfo:
      type: object
      properties:
        exact:
          type: boolean
        location:
          type: string
        version:
          type: string
    ExtendedStackTraceElement:
      type: object
      properties:
        extraClassInfo:
          $ref: '#/components/schemas/ExtendedClassInfo'
        stackTraceElement:
          type: object
        className:
          type: string
        exact:
          type: boolean
        fileName:
          type: string
        lineNumber:
          format: int32
          type: integer
        location:
          type: string
        methodName:
          type: string
        version:
          type: string
        nativeMethod:
          type: boolean
    FuelType:
      enum:
