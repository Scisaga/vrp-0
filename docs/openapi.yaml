---
openapi: 3.0.3
info:
  title: vrp-0 API
  version: 1.0.4-alpha-SNAPSHOT
tags:
- name: VRP求解引擎
  description: 维护单例当前场景、求解任务历史和最新任务指针的 VRP 求解引擎
- name: 地址查询生成
  description: 根据关键词、城市/adcode、类型批量生成真实地址
- name: 场景路由
  description: VRP单例场景的查询与更新
- name: 节点信息查询配置
  description: 查询/配置API私钥及限流策略
paths:
  /:
    get:
      tags:
      - 节点信息查询配置
      summary: 跳转到静态控制台
      responses:
        "303":
          description: 重定向到静态控制台入口
  /amap_conf:
    get:
      tags:
      - 节点信息查询配置
      summary: 查询API私钥及限流策略
      responses:
        "200":
          description: API私钥及限流策略
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conf'
  /map_context:
    get:
      tags:
      - 节点信息查询配置
      summary: 获取当前地图 SDK 上下文
      responses:
        "200":
          description: 当前图商的浏览器地图上下文
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MapContext'
  /matrix:
    get:
      tags:
      - 节点信息查询配置
      summary: 获取进程内 AMap 路由缓存矩阵
      description: 只访问 AmapTransitCalculator 的进程内缓存，不读取当前场景或求解任务中的矩阵。仅 MAP_PROVIDER=AMAP
        时可用。
      responses:
        "200":
          description: 进程内 AMap 路由缓存矩阵
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransitMatrix'
        "412":
          description: 当前地图提供方不是 AMap
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorInfo'
    post:
      tags:
      - 节点信息查询配置
      summary: 替换进程内 AMap 路由缓存矩阵
      description: 只更新 AmapTransitCalculator 的进程内缓存，不写入当前场景或求解任务中的矩阵。仅 MAP_PROVIDER=AMAP
        时可用。
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransitMatrix'
      responses:
        "200":
          description: 执行结果信息
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Msg'
        "412":
          description: 当前地图提供方不是 AMap
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorInfo'
  /mcp/doc:
    get:
      tags:
      - 节点信息查询配置
      summary: 打开 MCP 参考文档
      responses:
        "200":
          description: MCP Markdown 文档
        "404":
          description: 文档不存在
  /mcp/meta:
    get:
      tags:
      - 节点信息查询配置
      summary: 查询 MCP 接入摘要
      responses:
        "200":
          description: MCP 接入摘要
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/McpMeta'
  /pois:
    get:
      tags:
      - 地址查询生成
      summary: 按关键词查询 POI
      parameters:
      - name: city
        in: query
        description: 城市/adcode
        schema:
          type: string
      - name: keywords
        in: query
        description: 关键词
        required: true
        schema:
          type: string
      - name: page
        in: query
        description: 累计查询页数
        schema:
          format: int64
          default: 1
          minimum: 1
          type: integer
      - name: types
        in: query
        description: 类型
        schema:
          type: string
      responses:
        "200":
          description: 真实地址列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/POI'
        "400":
          description: 参数错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorInfo'
        "412":
          description: 当前地图提供方不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorInfo'
        "500":
          description: 请求当前地图提供方接口异常
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorInfo'
  /pois/geocode:
    get:
      tags:
      - 地址查询生成
      summary: 按地址文本执行地理编码
      parameters:
      - name: city
        in: query
        description: 城市/adcode
        schema:
          type: string
      - name: keywords
        in: query
        description: 关键词
        required: true
        schema:
          type: string
      responses:
        "200":
          description: 地理编码候选结果
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/POI'
        "400":
          description: 参数错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorInfo'
        "412":
          description: 当前地图提供方不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorInfo'
        "500":
          description: 请求当前地图提供方接口异常
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorInfo'
  /pois/regeocode:
    get:
      tags:
      - 地址查询生成
      summary: 按经纬度执行逆地理编码
      parameters:
      - name: location
        in: query
        description: "经纬度，格式：lng,lat"
        required: true
        schema:
          type: string
      responses:
        "200":
          description: 逆地理编码结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/POI'
        "400":
          description: 参数错误
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorInfo'
        "412":
          description: 当前地图提供方不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorInfo'
        "500":
          description: 请求当前地图提供方接口异常
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorInfo'
  /quota:
    get:
      tags:
      - 节点信息查询配置
      summary: 查询API私钥及限流策略（前端配置页口径）
      responses:
        "200":
          description: API私钥及限流策略
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conf'
    put:
      tags:
      - 节点信息查询配置
      summary: 更新API私钥及限流策略
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Conf'
      responses:
        "200":
          description: 已保存的API私钥及限流策略
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conf'
  /scenario:
    get:
      tags:
      - 场景路由
      summary: 获取当前场景
      responses:
        "200":
          description: 当前场景
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Scenario'
        "404":
          description: 当前没有场景
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorInfo'
    put:
      tags:
      - 场景路由
      summary: 创建或更新当前场景
      description: 保存时，已有坐标的 POI 仅在地址或城市为空时执行逆地理解析，并且只补齐缺失的地址和城市；无坐标但有地址的 POI 保持既有正向解析行为。已填写字段不会被自动覆盖，解析失败不会阻断保存。
      operationId: putScenario
      parameters:
      - name: build
        in: query
        description: 是否在普通的缺失位置补全之外，进一步完整构建 POI 和场景在途矩阵
        schema:
          default: false
          type: boolean
      - name: matrix_mode
        in: query
        description: 在途矩阵构建模式：ROUTING 使用当前 MAP_PROVIDER，MANHATTAN 使用离线估算；AMAP 仅兼容旧调用
        schema:
          allOf:
          - $ref: '#/components/schemas/MatrixMode'
          - default: ROUTING
      - name: replace
        in: query
        description: 是否按导入替换场景处理；为 true 时会清理历史求解任务
        schema:
          default: false
          type: boolean
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Scenario'
      responses:
        "200":
          description: 已保存的当前场景
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Scenario'
        "409":
          description: 当前求解任务运行中，不允许修改场景
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorInfo'
    delete:
      tags:
      - 场景路由
      summary: 删除当前场景
      responses:
        "200":
          description: 处理结果信息
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Msg'
        "404":
          description: 当前没有场景
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorInfo'
        "409":
          description: 当前求解任务运行中，不允许删除场景
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorInfo'
  /scenario/available_agents:
    get:
      tags:
      - 场景路由
      summary: 按2小时颗粒度获取当前场景空闲工程师数量
      responses:
        "200":
          description: 规划时间范围内的可用工程师数量数组（2小时一段）
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AvailableAgentWindow'
  /scenario/optional:
    get:
      tags:
      - 场景路由
      summary: 获取当前场景，若不存在则返回 JSON null
      responses:
        "200":
          description: 当前场景；不存在时返回 JSON null
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Scenario'
  /solver_job:
    get:
      tags:
      - VRP求解引擎
      summary: 获取当前求解任务
      parameters:
      - name: remove_virtual
        in: query
        description: 是否清除虚拟工程师指派
        schema:
          default: false
          type: boolean
      responses:
        "200":
          description: 当前求解任务
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolverJob'
        "404":
          description: 当前没有求解任务
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorInfo'
    post:
      tags:
      - VRP求解引擎
      summary: 基于当前场景提交求解
      parameters:
      - name: build_transit_matrix
        in: query
        description: 记录到任务并用于列表筛选的矩阵构建选项；当前求解阶段不会重新构建输入矩阵
        schema:
          default: false
          type: boolean
      - name: callback
        in: query
        description: 求解完成回调URL
        schema:
          default: ""
          type: string
      - name: draw_route
        in: query
        description: 是否生成完整路线规划
        schema:
          type: boolean
      - name: matrix_mode
        in: query
        description: 记录到任务的矩阵方式元数据：ROUTING、MANHATTAN；当前求解要求输入矩阵已预先构建，AMAP 仅兼容旧调用
        schema:
          allOf:
          - $ref: '#/components/schemas/MatrixMode'
          - default: ROUTING
      - name: solve_time
        in: query
        description: 期望求解时间。必须传 ISO-8601 duration 字符串（Java Duration 格式），不得传数字；例如 PT30S 表示 30 秒
        schema:
          default: PT30S
          type: string
          example: 'PT30S'
      responses:
        "200":
          description: 已提交的当前求解任务
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolverJob'
        "404":
          description: 当前没有场景
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorInfo'
        "409":
          description: 已有运行中的求解任务
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorInfo'
    delete:
      tags:
      - VRP求解引擎
      summary: 删除当前求解任务
      responses:
        "200":
          description: 请求成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Msg'
        "404":
          description: 当前没有求解任务
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorInfo'
  /solver_job/apply:
    post:
      tags:
      - VRP求解引擎
      summary: 将当前求解结果应用到当前场景
      responses:
        "200":
          description: 应用后的当前场景
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Scenario'
        "404":
          description: 当前没有场景或求解任务
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorInfo'
  /solver_job/list:
    get:
      tags:
      - VRP求解引擎
      summary: 按条件获取求解任务历史列表
      description: 未传筛选条件时返回全部任务，并按创建时间倒序排列。创建时间范围首尾均包含，必须严格使用 yyyy-MM-dd'T'HH:mm:ss，且不含时区。
      parameters:
      - name: build_transit_matrix
        in: query
        description: 按任务记录中的矩阵构建选项筛选
        schema:
          type: boolean
      - name: create_time_from
        in: query
        description: 创建时间起点（包含）。必须严格使用 yyyy-MM-dd'T'HH:mm:ss，不含时区
        schema:
          pattern: ^[0-9]{4}-(?:0[1-9]|1[0-2])-(?:0[1-9]|[12][0-9]|3[01])T(?:[01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]$
          type: string
          example: '2026-07-16T12:00:00'
      - name: create_time_to
        in: query
        description: 创建时间终点（包含）。必须严格使用 yyyy-MM-dd'T'HH:mm:ss，不含时区
        schema:
          pattern: ^[0-9]{4}-(?:0[1-9]|1[0-2])-(?:0[1-9]|[12][0-9]|3[01])T(?:[01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]$
          type: string
          example: '2026-07-16T12:00:00'
      - name: draw_route
        in: query
        description: 是否生成完整路线规划
        schema:
          type: boolean
      - name: matrix_mode
        in: query
        description: 按任务记录中的矩阵方式筛选：ROUTING、MANHATTAN；AMAP 兼容旧记录
        schema:
          $ref: '#/components/schemas/MatrixMode'
      - name: status
        in: query
        description: 任务状态
        schema:
          $ref: '#/components/schemas/Status1'
      responses:
        "400":
          description: 筛选参数非法
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorInfo'
        "200":
          description: 求解任务摘要列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SolverJobSummary'
  /solver_job/terminate:
    post:
      tags:
      - VRP求解引擎
      summary: 终止当前求解任务
      responses:
        "200":
          description: 当前求解任务
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolverJob'
        "404":
          description: 当前没有求解任务
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorInfo'
  /solver_job/{id}:
    get:
      tags:
      - VRP求解引擎
      summary: 按任务ID获取求解任务
      parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
      - name: remove_virtual
        in: query
        description: 是否清除虚拟工程师指派
        schema:
          default: false
          type: boolean
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolverJob'
    delete:
      tags:
      - VRP求解引擎
      summary: 删除指定求解任务
      parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Msg'
  /solver_job/{id}/apply:
    post:
      tags:
      - VRP求解引擎
      summary: 将指定求解结果应用到当前场景
      parameters:
      - name: id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/UUID'
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Scenario'
components:
  schemas:
    AgentEachDay:
      required:
      - id
      type: object
      properties:
        start_loc:
          description: 开始位置。可传 plan.pois 中 POI 的 ID 字符串，或直接传 POI 对象。
          example: B0G2X7N5D2
          oneOf:
          - type: string
          - $ref: '#/components/schemas/POI'
        name:
          type: string
        depo_id:
          description: 网点ID
          type: string
        skills:
          description: 服务技能
          type: array
          items:
            type: string
        qualification_levels:
          description: 工程师资质等级
          type: object
          additionalProperties:
            format: double
            type: number
        vehicle_type:
          description: 出行方式
          type: string
          allOf:
          - $ref: '#/components/schemas/VehicleType'
        fuel_type:
          description: 燃料类型
          type: string
          allOf:
          - $ref: '#/components/schemas/FuelType'
        fuel_consumption:
          format: double
          description: 每百公里燃油/电能消耗：GAS_92 为 L/100km，ELEC 为 kWh/100km
          type: number
        rented:
          description: 是否租借
          type: boolean
        fix_cost_daily:
          format: double
          description: 每日固定成本，单位元/日
          type: number
        size:
          format: int32
          description: 车辆大小
          type: integer
        height:
          format: double
          description: 车辆高度
          type: number
        width:
          format: double
          description: 车辆宽度
          type: number
        weight:
          format: double
          description: 核定载重，单位吨
          type: number
        vol:
          format: double
          description: 核定体积，单位立方米
          type: number
        routes:
          description: 路线
          type: array
          items:
            $ref: '#/components/schemas/Route'
        matrix:
          description: 在途矩阵句柄
          type: object
          allOf:
          - $ref: '#/components/schemas/TransitMatrix'
        cost_parameter:
          description: 成本参数
          type: object
          allOf:
          - $ref: '#/components/schemas/CostParameter'
        virtual:
          description: 是否虚拟工程师
          type: boolean
        date:
          description: 日期
          type: string
          allOf:
          - $ref: '#/components/schemas/LocalDate'
        restrict:
          description: 是否当日限行
          type: boolean
        max_ticket_num:
          format: int32
          description: 当日最大接单量
          type: integer
        shift_start_time:
          description: 最早指派时间
          type: string
          allOf:
          - $ref: '#/components/schemas/LocalDateTime'
        shift_off_time:
          description: 最晚完成时间
          type: string
          allOf:
          - $ref: '#/components/schemas/LocalDateTime'
        tickets:
          description: 分配工单ID列表
          type: array
          items:
            type: string
          example:
          - ticket-1
          - ticket-2
        id:
          type: string
        transit_weight:
          format: double
          type: number
          readOnly: true
        transit_vol:
          format: double
          type: number
          readOnly: true
        transit_loading:
          type: object
          allOf:
          - $ref: '#/components/schemas/Capacity'
          readOnly: true
        total_driving_time_seconds:
          format: int64
          type: integer
          readOnly: true
        total_driving_distance_meters:
          format: int64
          type: integer
          readOnly: true
        tickets_done_time:
          type: string
          allOf:
          - $ref: '#/components/schemas/LocalDateTime'
          readOnly: true
    AvailableAgentWindow:
      type: object
      properties:
        start_time:
          $ref: '#/components/schemas/LocalDateTime'
        end_time:
          $ref: '#/components/schemas/LocalDateTime'
        available_agents:
          format: int32
          type: integer
    Capacity:
      type: object
      properties:
        weight:
          format: double
          type: number
        vol:
          format: double
          type: number
    Conf:
      type: object
      properties:
        key:
          type: string
        qps:
          format: int32
          type: integer
        quota:
          format: int64
          type: integer
        interval:
          $ref: '#/components/schemas/Duration'
        wait_timeout:
          $ref: '#/components/schemas/Duration'
        geocode_provider:
          $ref: '#/components/schemas/GeocodeProvider'
        address_resolver_url:
          type: string
        address_resolver_fallback_to_amap:
          type: boolean
    CostParameter:
      type: object
      properties:
        start_price:
          format: double
          description: 起步价
          type: number
