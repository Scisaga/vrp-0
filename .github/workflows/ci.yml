name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

jobs:
  mcp-result-view-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate offline MCP result-view contract
        run: |
          python -m pip install -r scripts/tests/requirements-mcp-contract.txt
          python -B -m unittest discover -s scripts/tests -p 'test_mcp_result_view_contract.py' -v

  static-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build and test localized static UI
        working-directory: src/main/resources/META-INF/resources/static
        run: |
          npm ci --include=dev
          npx playwright install --with-deps chromium
          npm run build:css
          npm run build:scenario
          npm run verify:scenario
          node --test tests/*.test.mjs
          npm run test:i18n-ui
          npm run build:mcp-app
          npm run verify:mcp-app
          git diff --exit-code -- mcp-app.html
          npm run test:mcp-unit
          npm run test:mcp-ui

  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v3
      - name: Run core regression tests
        run: |
          ./gradlew test --no-daemon --tests 'one.rewind.xforce.vehicle_routing.rest.test.NodeResourceTest'
          ./gradlew test --no-daemon --tests 'one.rewind.xforce.vehicle_routing.rest.test.PoiResourceDisabledTest'
          ./gradlew test --no-daemon --tests 'one.rewind.xforce.vehicle_routing.rest.test.ScenarioResourceAuxTest'
          ./gradlew test --no-daemon --tests 'one.rewind.xforce.vehicle_routing.mcp.test.McpServerTest'

  jvm-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v3
      - name: Build JVM artifact
        run: ./gradlew quarkusBuild -x test --no-daemon

  native-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v3
      - name: Build native artifact
        run: ./gradlew quarkusBuild -Dquarkus.package.type=native -x test --no-daemon
