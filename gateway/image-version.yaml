image:
  name: x-force/vrp-0
  version: 1.1.0-alpha-SNAPSHOT
display_name: VRP0 Solver（AMAP / HERE）
description: 支持 AMAP 和 HERE 图商的 VRP0 车辆路径求解；地图图商由请求中的 map_provider 选择。
supported_map_providers:
  - AMAP
  - HERE
base_credit_cost: 10.0000
duration_credit_per_10s: 2.5000
limits_json: '{"platform_max_orders":1000,"platform_max_vehicles":200}'
request_schema_source:
  type: openapi
  file: docs/openapi.yaml
  operation_id: putScenario
  request_content_type: application/json

# MCP App 本体保持严格 CSP；只有地图 renderer 声明图商网络和必要的动态执行能力。
# Gateway 导入后使用自身受控 HTTPS origin 发布 renderer，再为 map 资源生成 frameDomains。
mcp_ui:
  contract_version: gateway_mcp_result_v1
  result_view_kind: vrp0
  result_view_schema_version: 2
  resources:
    map:
      file: mcp-map-app.html
      display_modes: [inline, fullscreen]
      csp:
        connect_domains: []
        resource_domains: []
      renderer:
        file: mcp-map-renderer.html
        csp:
          allow_unsafe_eval: true
          allow_blob_workers: true
          connect_domains:
            - https://js.api.here.com
            - https://vector.hereapi.com
            - https://maps.hereapi.com
            - https://vdata.amap.com
          resource_domains:
            - https://webapi.amap.com
            - https://js.api.here.com
            - https://maps.hereapi.com
            - https://vdata.amap.com
            - https://restapi.amap.com
    gantt:
      file: mcp-gantt-app.html
      display_modes: [inline, fullscreen]
      csp:
        connect_domains: []
        resource_domains: []
